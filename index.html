<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афиша Уфы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        header {
            text-align: center;
            margin-bottom: 32px;
            padding: 24px 0;
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        header p {
            color: #6e6e73;
            font-size: 1.1rem;
        }
        
        /* Панель фильтров */
        .controls {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: sticky;
            top: 12px;
            z-index: 100;
        }
        
        .search-box {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            border: 2px solid #e5e5ea;
            border-radius: 12px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #007aff;
        }
        
        .filter-group {
            margin-bottom: 12px;
        }
        
        .filter-group:last-child {
            margin-bottom: 0;
        }
        
        .filter-label {
            font-size: 0.85rem;
            color: #6e6e73;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .chip {
            padding: 8px 16px;
            background: #f2f2f7;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #1d1d1f;
            font-weight: 500;
        }
        
        .chip:hover {
            background: #e5e5ea;
        }
        
        .chip.active {
            background: #007aff;
            color: white;
        }
        
        /* Сетка карточек */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .event-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        
        .event-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #e5e5ea;
        }
        
        .event-image-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }
        
        .event-body {
            padding: 16px 20px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .event-category {
            display: inline-block;
            padding: 4px 10px;
            background: #f2f2f7;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #6e6e73;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            align-self: flex-start;
        }
        
        .event-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .event-desc {
            color: #6e6e73;
            font-size: 0.9rem;
            margin-bottom: 12px;
            flex: 1;
        }
        
        .event-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
            color: #1d1d1f;
            margin-bottom: 12px;
        }
        
        .event-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .event-meta-item .icon {
            font-size: 1rem;
        }
        
        .event-actions {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid #f2f2f7;
        }
        
        .btn {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        
        .btn-primary {
            background: #007aff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0056b3;
        }
        
        .btn-secondary {
            background: #f2f2f7;
            color: #1d1d1f;
        }
        
        .btn-secondary:hover {
            background: #e5e5ea;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6e6e73;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #1d1d1f;
        }
        
        .counter {
            text-align: center;
            color: #6e6e73;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        
        @media (max-width: 640px) {
            .container { padding: 16px; }
            header h1 { font-size: 1.8rem; }
            .events-grid { grid-template-columns: 1fr; }
            .controls { position: static; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎭 Афиша Уфы</h1>
            <p>Все события города в одном месте</p>
        </header>
        
        <div class="controls">
            <input type="text" class="search-box" id="search" placeholder="🔍 Поиск по названию или описанию...">
            
            <div class="filter-group">
                <div class="filter-label">Когда</div>
                <div class="chips" id="date-filters">
                    <button class="chip active" data-date="all">Все</button>
                    <button class="chip" data-date="today">Сегодня</button>
                    <button class="chip" data-date="weekend">Выходные</button>
                    <button class="chip" data-date="week">Неделя</button>
                </div>
            </div>
            
            <div class="filter-group">
                <div class="filter-label">Категория</div>
                <div class="chips" id="category-filters">
                    <button class="chip active" data-category="all">Все</button>
                    <button class="chip" data-category="concert">🎵 Музыка</button>
                    <button class="chip" data-category="party">🎉 Вечеринки</button>
                    <button class="chip" data-category="cinema">🎬 Кино</button>
                    <button class="chip" data-category="theater">🎭 Театр</button>
                    <button class="chip" data-category="lecture">📚 Лекции</button>
                    <button class="chip" data-category="exhibition">🖼️ Выставки</button>
                    <button class="chip" data-category="market">🛍️ Маркеты</button>
                    <button class="chip" data-category="festival">🎪 Фестивали</button>
                    <button class="chip" data-category="standup">🎤 Стендап</button>
                    <button class="chip" data-category="other">✨ Другое</button>
                </div>
            </div>
        </div>
        
        <div class="counter" id="counter"></div>
        <div class="events-grid" id="events-grid"></div>
    </div>

    <script>
        // Названия категорий на русском
        const CATEGORY_NAMES = {
            concert: "Музыка", party: "Вечеринка", cinema: "Кино", theater: "Театр",
            lecture: "Лекция", exhibition: "Выставка", market: "Маркет", festival: "Фестиваль",
            standup: "Стендап", quiz: "Квиз", other: "Событие"
        };
        
        // Иконки-заглушки для категорий
        const CATEGORY_ICONS = {
            concert: "🎵", party: "🎉", cinema: "🎬", theater: "🎭",
            lecture: "📚", exhibition: "🖼️", market: "🛍️", festival: "🎪",
            standup: "🎤", quiz: "🧠", other: "✨"
        };
        
        let allEvents = [];
        let activeDateFilter = "all";
        let activeCategoryFilter = "all";
        let searchQuery = "";
        
        // Загрузка данных
        async function loadEvents() {
            try {
                const response = await fetch('events.json?t=' + Date.now());
                allEvents = await response.json();
                renderEvents();
            } catch (e) {
                document.getElementById('events-grid').innerHTML = 
                    '<div class="empty-state"><h3>Не удалось загрузить события</h3><p>Проверьте файл events.json</p></div>';
            }
        }
        
        // Фильтрация
        function filterEvents() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekEnd = new Date(today); weekEnd.setDate(today.getDate() + 7);
            
            // Определяем ближайшие выходные (суббота и воскресенье)
            const daysUntilSat = (6 - now.getDay() + 7) % 7 || 7;
            const weekendStart = new Date(today); weekendStart.setDate(today.getDate() + daysUntilSat);
            const weekendEnd = new Date(weekendStart); weekendEnd.setDate(weekendStart.getDate() + 2);
            
            return allEvents.filter(ev => {
                // Фильтр по поисковому запросу
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const inTitle = (ev.title || "").toLowerCase().includes(q);
                    const inDesc = (ev.desc || "").toLowerCase().includes(q);
                    const inVenue = (ev.venue || "").toLowerCase().includes(q);
                    if (!inTitle && !inDesc && !inVenue) return false;
                }
                
                // Фильтр по категории
                if (activeCategoryFilter !== "all" && ev.kind !== activeCategoryFilter) {
                    return false;
                }
                
                // Фильтр по дате
                if (activeDateFilter !== "all" && ev.start) {
                    const evDate = new Date(ev.start);
                    if (activeDateFilter === "today") {
                        const evDay = new Date(evDate.getFullYear(), evDate.getMonth(), evDate.getDate());
                        if (evDay.getTime() !== today.getTime()) return false;
                    } else if (activeDateFilter === "weekend") {
                        if (evDate < weekendStart || evDate >= weekendEnd) return false;
                    } else if (activeDateFilter === "week") {
                        if (evDate < today || evDate >= weekEnd) return false;
                    }
                } else if (activeDateFilter !== "all" && !ev.start) {
                    return false;
                }
                
                return true;
            });
        }
        
        // Форматирование даты
        function formatDate(dateStr) {
            if (!dateStr) return "Дата уточняется";
            const d = new Date(dateStr);
            const months = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
            const days = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
            return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
        }
        
        function formatTime(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        
        // Генерация .ics файла для календаря
        function downloadICS(ev) {
            if (!ev.start) {
                alert("Дата события не указана");
                return;
            }
            const start = new Date(ev.start);
            const end = new Date(start.getTime() + 2 * 60 * 60 * 1000); // +2 часа по умолчанию
            
            const fmt = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            
            const ics = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "BEGIN:VEVENT",
                `DTSTART:${fmt(start)}`,
                `DTEND:${fmt(end)}`,
                `SUMMARY:${ev.title || "Событие"}`,
                `DESCRIPTION:${(ev.desc || "").replace(/\n/g, ' ').substring(0, 200)}`,
                `LOCATION:${ev.venue || ""}`,
                `URL:${ev.source_link || ""}`,
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");
            
            const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(ev.title || "event").substring(0, 40)}.ics`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Рендер карточек
        function renderEvents() {
            const filtered = filterEvents();
            
            // Сортировка: сначала события с датой, по возрастанию
            filtered.sort((a, b) => {
                if (!a.start) return 1;
                if (!b.start) return -1;
                return new Date(a.start) - new Date(b.start);
            });
            
            const grid = document.getElementById('events-grid');
            const counter = document.getElementById('counter');
            
            counter.textContent = `Найдено событий: ${filtered.length}`;
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state"><h3>Ничего не найдено</h3><p>Попробуйте изменить фильтры или поисковый запрос</p></div>';
                return;
            }
            
            grid.innerHTML = filtered.map(ev => {
                const catName = CATEGORY_NAMES[ev.kind] || "Событие";
                const catIcon = CATEGORY_ICONS[ev.kind] || "✨";
                const imageHtml = ev.image 
                    ? `<img src="${ev.image}" class="event-image" alt="" loading="lazy">`
                    : `<div class="event-image-placeholder">${catIcon}</div>`;
                
                const dateInfo = ev.start 
                    ? `${formatDate(ev.start)}${ev.start ? ', ' + formatTime(ev.start) : ''}`
                    : (ev.date_text || "Дата уточняется");
                
                return `
                    <div class="event-card">
                        ${imageHtml}
                        <div class="event-body">
                            <span class="event-category">${catName}</span>
                            <h3 class="event-title">${ev.title || "Событие"}</h3>
                            <p class="event-desc">${ev.desc || ""}</p>
                            <div class="event-meta">
                                <div class="event-meta-item"><span class="icon">📅</span> ${dateInfo}</div>
                                ${ev.venue ? `<div class="event-meta-item"><span class="icon">📍</span> ${ev.venue}</div>` : ''}
                                ${ev.price ? `<div class="event-meta-item"><span class="icon">💰</span> ${ev.price}</div>` : ''}
                            </div>
                            <div class="event-actions">
                                <a href="${ev.source_link}" target="_blank" class="btn btn-secondary">Источник</a>
                                <button onclick='downloadICS(${JSON.stringify(ev).replace(/'/g, "&apos;")})' class="btn btn-primary">📅 В календарь</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Обработчики фильтров
        document.getElementById('date-filters').addEventListener('click', (e) => {
            if (e.target.classList.contains('chip')) {
                document.querySelectorAll('#date-filters .chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                activeDateFilter = e.target.dataset.date;
                renderEvents();
            }
        });
        
        document.getElementById('category-filters').addEventListener('click', (e) => {
            if (e.target.classList.contains('chip')) {
                document.querySelectorAll('#category-filters .chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                activeCategoryFilter = e.target.dataset.category;
                renderEvents();
            }
        });
        
        document.getElementById('search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderEvents();
        });
        
        // Старт
        loadEvents();
    </script>
</body>
</html>
