<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Уфа для своих — афиша</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #262626;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --accent: #c4ff4d;
            --sidebar-width: 520px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            padding-bottom: 80px;
            max-width: 1200px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
        h1 span { color: var(--accent); }
        #count { color: var(--muted); font-size: 0.9rem; font-weight: 500; }

        .search-wrap { margin-bottom: 20px; position: relative; }
        .search-wrap input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px 14px 44px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
        }

        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .filters button {
            background: var(--card); color: var(--muted);
            border: 1px solid var(--border); padding: 10px 20px;
            border-radius: 100px; cursor: pointer; font-size: 0.9rem;
            transition: all 0.2s; font-weight: 500;
        }
        .filters button:hover { border-color: var(--accent); color: var(--text); }
        .filters button.active {
            background: var(--accent); color: #000;
            border-color: var(--accent); font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; overflow: hidden;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            display: flex; flex-direction: column;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(196, 255, 77, 0.08);
        }
        .card-image {
            width: 100%; aspect-ratio: 4/3;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            background-size: cover; background-position: center;
            position: relative;
        }
        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-tag {
            display: inline-block; font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent);
            margin-bottom: 8px; font-weight: 700;
        }
        .card h3 {
            font-size: 1.05rem; margin-bottom: 10px;
            line-height: 1.35; font-weight: 700;
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-meta {
            font-size: 0.85rem; color: var(--muted);
            margin-bottom: 5px; display: flex; align-items: center; gap: 6px;
        }
        .card-price {
            margin-top: auto; padding-top: 12px;
            font-weight: 800; font-size: 1rem;
        }
        .card-price.free { color: var(--accent); }

        /* Сайдбар */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 998;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            max-width: 100%;
            height: 100vh;
            background: #0f0f0f;
            border-left: 1px solid var(--border);
            z-index: 999;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar.active { transform: translateX(0); }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sidebar-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            line-height: 1;
        }
        .sidebar-close:hover { background: rgba(255,255,255,0.15); }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .sidebar-content::-webkit-scrollbar { width: 8px; }
        .sidebar-content::-webkit-scrollbar-track { background: transparent; }
        .sidebar-content::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .sidebar-image {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            aspect-ratio: 4/3;
            background-size: cover;
            background-position: center;
        }
        .sidebar-tag {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 700;
            padding: 4px 10px;
            background: rgba(196, 255, 77, 0.1);
            border-radius: 6px;
        }
        .sidebar-title {
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        .sidebar-meta {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        .sidebar-meta-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.95rem;
        }
        .sidebar-meta-item .icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }
        .sidebar-meta-item .label {
            color: var(--muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .sidebar-meta-item .value {
            color: var(--text);
            font-weight: 500;
        }
        .sidebar-meta-item .value.price-free {
            color: var(--accent);
            font-weight: 700;
        }

        .sidebar-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #d0d0d0;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }
        .sidebar-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .sidebar-btn.primary {
            background: var(--accent);
            color: #000;
        }
        .sidebar-btn.primary:hover { opacity: 0.85; transform: translateY(-2px); }
        .sidebar-btn.secondary {
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .sidebar-btn.secondary:hover { background: rgba(255,255,255,0.1); }

        .empty { text-align: center; padding: 80px 20px; color: var(--muted); grid-column: 1/-1; }

        @media (max-width: 600px) {
            :root { --sidebar-width: 100%; }
            h1 { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
            .filters button { padding: 8px 14px; font-size: 0.85rem; }
            .sidebar-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Уфа <span>для своих</span></h1>
        <div id="count"></div>
    </header>

    <div class="search-wrap">
        <input type="text" id="search" placeholder="Поиск по событиям...">
    </div>

    <div class="filters">
        <button data-filter="all" class="active">Все</button>
        <button data-filter="free">Бесплатно</button>
        <button data-filter="party">Тусовки</button>
        <button data-filter="music">Музыка</button>
        <button data-filter="art">Арт</button>
        <button data-filter="today">Сегодня</button>
    </div>

    <div id="feed" class="grid"></div>

    <!-- Оверлей -->
    <div class="sidebar-overlay" id="overlay"></div>

    <!-- Сайдбар -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Событие</h2>
            <button class="sidebar-close" id="sidebar-close">×</button>
        </div>
        <div class="sidebar-content" id="sidebar-content"></div>
    </aside>

    <script>
        let allEvents = [];
        let currentFilter = 'all';
        let searchQuery = '';

        async function load() {
            try {
                const res = await fetch('events.json?t=' + Date.now());
                allEvents = await res.json();
                render();
            } catch (err) {
                document.getElementById('feed').innerHTML =
                    '<div class="empty">Ошибка загрузки данных.</div>';
                console.error(err);
            }
        }

        function formatDate(e) {
            const parts = [];
            if (e.date_text) parts.push(e.date_text);
            if (e.time_text) parts.push(e.time_text);
            if (parts.length) return parts.join(' · ');
            return 'Дата уточняется';
        }

        function isToday(e) {
            if (!e.date_text) return false;
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return e.date_text === `${dd}.${mm}.${yyyy}`;
        }

        function sortEvents(events) {
            return [...events].sort((a, b) => {
                const aHasDate = !!a.date_text;
                const bHasDate = !!b.date_text;
                if (aHasDate && bHasDate) return a.date_text.localeCompare(b.date_text);
                if (aHasDate) return -1;
                if (bHasDate) return 1;
                return 0;
            });
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s || '';
            return div.innerHTML;
        }

        function render() {
            const feed = document.getElementById('feed');
            const countEl = document.getElementById('count');

            let filtered = allEvents;

            if (currentFilter === 'free') {
                filtered = filtered.filter(e => (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод'));
            } else if (currentFilter === 'party') {
                filtered = filtered.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('вечерин') || t.includes('party') || t.includes('тусов') || t.includes('рейв');
                });
            } else if (currentFilter === 'music') {
                filtered = filtered.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('концерт') || t.includes('музык') || t.includes('джаз') || t.includes('dj');
                });
            } else if (currentFilter === 'art') {
                filtered = filtered.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('выстав') || t.includes('арт') || t.includes('галере') || t.includes('музей');
                });
            } else if (currentFilter === 'today') {
                filtered = filtered.filter(isToday);
            }

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(e => {
                    const text = ((e.title || '') + ' ' + (e.desc || '') + ' ' + (e.venue || '')).toLowerCase();
                    return text.includes(q);
                });
            }

            filtered = sortEvents(filtered);
            countEl.textContent = filtered.length + ' событий';

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="empty">Ничего не найдено. Попробуй другой фильтр.</div>';
                return;
            }

            feed.innerHTML = filtered.map((e, idx) => {
                const img = e.image ? `style="background-image: url('${e.image}')"` : '';
                const priceClass = (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод') ? 'free' : '';
                const source = e.source ? `<div class="card-tag">@${e.source}</div>` : '';

                return `
                    <div class="card" data-index="${idx}" onclick="openSidebar(${idx})">
                        <div class="card-image" ${img}></div>
                        <div class="card-body">
                            ${source}
                            <h3>${escapeHtml(e.title) || 'Без названия'}</h3>
                            <div class="card-meta">📅 ${formatDate(e)}</div>
                            <div class="card-meta">📍 ${escapeHtml(e.venue) || 'Место уточняется'}</div>
                            <div class="card-price ${priceClass}">${escapeHtml(e.price) || 'Цена уточняется'}</div>
                        </div>
                    </div>
                `;
            }).join('');

            window.currentFiltered = filtered;
        }

        // Сайдбар
        function openSidebar(index) {
            const e = window.currentFiltered[index];
            if (!e) return;

            const content = document.getElementById('sidebar-content');
            const isFree = (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод');

            const imgHtml = e.image
                ? `<div class="sidebar-image" style="background-image: url('${e.image}')"></div>`
                : `<div class="sidebar-image"></div>`;

            const tagHtml = e.source ? `<div class="sidebar-tag">@${escapeHtml(e.source)}</div>` : '';

            // Полный текст: используем raw (оригинал) или desc
            const fullText = e.raw || e.desc || 'Описание отсутствует.';

            content.innerHTML = `
                ${imgHtml}
                ${tagHtml}
                <h1 class="sidebar-title">${escapeHtml(e.title) || 'Без названия'}</h1>

                <div class="sidebar-meta">
                    <div class="sidebar-meta-item">
                        <span class="icon">📅</span>
                        <div>
                            <div class="label">Дата и время</div>
                            <div class="value">${formatDate(e)}</div>
                        </div>
                    </div>
                    <div class="sidebar-meta-item">
                        <span class="icon">📍</span>
                        <div>
                            <div class="label">Место</div>
                            <div class="value">${escapeHtml(e.venue) || 'Уточняется'}</div>
                        </div>
                    </div>
                    <div class="sidebar-meta-item">
                        <span class="icon">💰</span>
                        <div>
                            <div class="label">Цена</div>
                            <div class="value ${isFree ? 'price-free' : ''}">${escapeHtml(e.price) || 'Уточняется'}</div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-text">${escapeHtml(fullText)}</div>

                <div class="sidebar-actions">
                    ${e.source_link ? `<a class="sidebar-btn primary" href="${e.source_link}" target="_blank" rel="noopener">📱 Открыть в Telegram</a>` : ''}
                    <button class="sidebar-btn secondary" onclick="closeSidebar()">Закрыть</button>
                </div>
            `;

            document.getElementById('sidebar').classList.add('active');
            document.getElementById('overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('sidebar-close').addEventListener('click', closeSidebar);
        document.getElementById('overlay').addEventListener('click', closeSidebar);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
        });

        // Поиск
        document.getElementById('search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        // Фильтры
        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        load();
    </script>
</body>
</html>
