<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Уфа для своих — афиша</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #262626;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --accent: #c4ff4d;
            --sidebar-width: 720px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            padding-bottom: 80px;
            max-width: 1200px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
        h1 span { color: var(--accent); }
        #count { color: var(--muted); font-size: 0.9rem; font-weight: 500; }

        .search-wrap { margin-bottom: 20px; position: relative; }
        .search-wrap input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px 14px 44px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
        }

        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .filters button {
            background: var(--card); color: var(--muted);
            border: 1px solid var(--border); padding: 10px 20px;
            border-radius: 100px; cursor: pointer; font-size: 0.9rem;
            transition: all 0.2s; font-weight: 500;
        }
        .filters button:hover { border-color: var(--accent); color: var(--text); }
        .filters button.active {
            background: var(--accent); color: #000;
            border-color: var(--accent); font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; overflow: hidden;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            display: flex; flex-direction: column;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(196, 255, 77, 0.08);
        }
        .card-image {
            width: 100%; aspect-ratio: 4/3;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            background-size: cover; background-position: center;
            position: relative;
        }
        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-tag {
            display: inline-block; font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent);
            margin-bottom: 8px; font-weight: 700;
        }
        .card h3 {
            font-size: 1.05rem; margin-bottom: 10px;
            line-height: 1.35; font-weight: 700;
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-meta {
            font-size: 0.85rem; color: var(--muted);
            margin-bottom: 5px; display: flex; align-items: center; gap: 6px;
        }
        .card-price {
            margin-top: auto; padding-top: 12px;
            font-weight: 800; font-size: 1rem;
        }
        .card-price.free { color: var(--accent); }

        /* Оверлей */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 998;
            backdrop-filter: blur(6px);
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        /* Сайдбар — «карточка-письмо» */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            max-width: 100%;
            height: 100vh;
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            pointer-events: none;
            perspective: 1500px;
        }
        .sidebar.active {
            transform: translateX(0);
            pointer-events: auto;
        }

        /* Контейнер для 3D-поворота */
        .card-3d {
            width: 100%;
            height: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: row;
            background: #0f0f0f;
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                0 40px 100px rgba(0,0,0,0.7),
                0 0 0 1px rgba(255,255,255,0.05) inset;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: grab;
            position: relative;
        }
        .card-3d:active { cursor: grabbing; }

        /* Левая часть — картинка */
        .card-3d-image {
            flex: 0 0 50%;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            background-size: cover;
            background-position: center;
            position: relative;
            min-height: 100%;
        }
        .card-3d-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent 70%, rgba(15,15,15,0.4));
        }

        /* Правая часть — текст */
        .card-3d-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card-3d-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .card-3d-header h2 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .card-3d-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text);
            font-size: 1.4rem;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            line-height: 1;
            flex-shrink: 0;
        }
        .card-3d-close:hover { background: rgba(255,255,255,0.18); }

        .card-3d-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .card-3d-scroll::-webkit-scrollbar { width: 8px; }
        .card-3d-scroll::-webkit-scrollbar-track { background: transparent; }
        .card-3d-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .card-3d-tag {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 700;
            padding: 4px 10px;
            background: rgba(196, 255, 77, 0.1);
            border-radius: 6px;
        }
        .card-3d-title {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        .card-3d-meta {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        .card-3d-meta-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.95rem;
        }
        .card-3d-meta-item .icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }
        .card-3d-meta-item .label {
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .card-3d-meta-item .value { color: var(--text); font-weight: 500; }
        .card-3d-meta-item .value.price-free { color: var(--accent); font-weight: 700; }

        .card-3d-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #d0d0d0;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .card-3d-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card-3d-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .card-3d-btn.primary {
            background: var(--accent);
            color: #000;
        }
        .card-3d-btn.primary:hover { opacity: 0.85; transform: translateY(-2px); }
        .card-3d-btn.secondary {
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .card-3d-btn.secondary:hover { background: rgba(255,255,255,0.1); }

        /* Подсказка «поверни» */
        .card-3d-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: var(--muted);
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 100px;
            border: 1px solid var(--border);
            pointer-events: none;
            transition: opacity 0.4s;
            opacity: 0;
        }
        .sidebar.active .card-3d-hint { opacity: 1; }
        .card-3d.touched .card-3d-hint { opacity: 0; }

        .empty { text-align: center; padding: 80px 20px; color: var(--muted); grid-column: 1/-1; }

        @media (max-width: 700px) {
            :root { --sidebar-width: 100%; }
            .sidebar { padding: 20px 10px; }
            .card-3d {
                flex-direction: column;
                max-height: 95vh;
            }
            .card-3d-image { flex: 0 0 40%; }
            .card-3d-title { font-size: 1.15rem; }
            h1 { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
            .filters button { padding: 8px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Уфа <span>для своих</span></h1>
        <div id="count"></div>
    </header>

    <div class="search-wrap">
        <input type="text" id="search" placeholder="Поиск по событиям...">
    </div>

    <div class="filters">
        <button data-filter="all" class="active">Все</button>
        <button data-filter="free">Бесплатно</button>
        <button data-filter="party">Тусовки</button>
        <button data-filter="music">Музыка</button>
        <button data-filter="art">Арт</button>
        <button data-filter="today">Сегодня</button>
    </div>

    <div id="feed" class="grid"></div>

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="card-3d" id="card-3d">
            <div class="card-3d-image" id="card-3d-image"></div>
            <div class="card-3d-body">
                <div class="card-3d-header">
                    <h2>Событие</h2>
                    <button class="card-3d-close" id="sidebar-close">×</button>
                </div>
                <div class="card-3d-scroll" id="card-3d-content"></div>
            </div>
            <div class="card-3d-hint">👆 Поверни карточку</div>
        </div>
    </aside>

    <script>
        let allEvents = [];
        let currentFilter = 'all';
        let searchQuery = '';

        async function load() {
            try {
                const res = await fetch('events.json?t=' + Date.now());
                allEvents = await res.json();
                render();
            } catch (err) {
                document.getElementById('feed').innerHTML =
                    '<div class="empty">Ошибка загрузки данных.</div>';
                console.error(err);
            }
        }

        function formatDate(e) {
            const parts = [];
            if (e.date_text) parts.push(e.date_text);
            if (e.time_text) parts.push(e.time_text);
            if (parts.length) return parts.join(' · ');
            return 'Дата уточняется';
        }

        function isToday(e) {
            if (!e.date_text) return false;
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return e.date_text === `${dd}.${mm}.${yyyy}`;
        }

        function sortEvents(events) {
            return [...events].sort((a, b) => {
                const aHasDate = !!a.date_text;
                const bHasDate = !!b.date_text;
                if (aHasDate && bHasDate) return a.date_text.localeCompare(b.date_text);
                if (aHasDate) return -1;
                if (bHasDate) return 1;
                return 0;
            });
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s || '';
            return div.innerHTML;
        }

        function render() {
            const feed = document.getElementById('feed');
            const countEl = document.getElementById('count');

            let filtered = allEvents;

            if (currentFilter === 'free') {
                filtered = filtered.filter(e => (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод'));
            } else if (currentFilter === 'party') {
                filtered = filtered.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('вечерин') || t.includes('party') || t.includes('тусов') || t.includes('рейв');
                });
            } else if (currentFilter === 'music') {
                filtered = filtered.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('концерт') || t.includes('музык') || t.includes('джаз') || t.includes('dj');
                });
            } else if (currentFilter === 'art') {
                filtered = filtered.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('выстав') || t.includes('арт') || t.includes('галере') || t.includes('музей');
                });
            } else if (currentFilter === 'today') {
                filtered = filtered.filter(isToday);
            }

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(e => {
                    const text = ((e.title || '') + ' ' + (e.desc || '') + ' ' + (e.venue || '')).toLowerCase();
                    return text.includes(q);
                });
            }

            filtered = sortEvents(filtered);
            countEl.textContent = filtered.length + ' событий';

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="empty">Ничего не найдено. Попробуй другой фильтр.</div>';
                return;
            }

            feed.innerHTML = filtered.map((e, idx) => {
                const img = e.image ? `style="background-image: url('${e.image}')"` : '';
                const priceClass = (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод') ? 'free' : '';
                const source = e.source ? `<div class="card-tag">@${e.source}</div>` : '';

                return `
                    <div class="card" data-index="${idx}" onclick="openSidebar(${idx})">
                        <div class="card-image" ${img}></div>
                        <div class="card-body">
                            ${source}
                            <h3>${escapeHtml(e.title) || 'Без названия'}</h3>
                            <div class="card-meta">📅 ${formatDate(e)}</div>
                            <div class="card-meta">📍 ${escapeHtml(e.venue) || 'Место уточняется'}</div>
                            <div class="card-price ${priceClass}">${escapeHtml(e.price) || 'Цена уточняется'}</div>
                        </div>
                    </div>
                `;
            }).join('');

            window.currentFiltered = filtered;
        }

        // Сайдбар
        function openSidebar(index) {
            const e = window.currentFiltered[index];
            if (!e) return;

            const content = document.getElementById('card-3d-content');
            const imgEl = document.getElementById('card-3d-image');
            const isFree = (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод');

            // Картинка
            if (e.image) {
                imgEl.style.backgroundImage = `url('${e.image}')`;
            } else {
                imgEl.style.backgroundImage = 'linear-gradient(135deg, #1a1a1a, #2a2a2a)';
            }

            const tagHtml = e.source ? `<div class="card-3d-tag">@${escapeHtml(e.source)}</div>` : '';
            const fullText = e.raw || e.desc || 'Описание отсутствует.';

            content.innerHTML = `
                ${tagHtml}
                <h1 class="card-3d-title">${escapeHtml(e.title) || 'Без названия'}</h1>

                <div class="card-3d-meta">
                    <div class="card-3d-meta-item">
                        <span class="icon">📅</span>
                        <div>
                            <div class="label">Дата и время</div>
                            <div class="value">${formatDate(e)}</div>
                        </div>
                    </div>
                    <div class="card-3d-meta-item">
                        <span class="icon">📍</span>
                        <div>
                            <div class="label">Место</div>
                            <div class="value">${escapeHtml(e.venue) || 'Уточняется'}</div>
                        </div>
                    </div>
                    <div class="card-3d-meta-item">
                        <span class="icon">💰</span>
                        <div>
                            <div class="label">Цена</div>
                            <div class="value ${isFree ? 'price-free' : ''}">${escapeHtml(e.price) || 'Уточняется'}</div>
                        </div>
                    </div>
                </div>

                <div class="card-3d-text">${escapeHtml(fullText)}</div>

                <div class="card-3d-actions">
                    ${e.source_link ? `<a class="card-3d-btn primary" href="${e.source_link}" target="_blank" rel="noopener">📱 Открыть в Telegram</a>` : ''}
                    <button class="card-3d-btn secondary" onclick="closeSidebar()">Закрыть</button>
                </div>
            `;

            // Сброс поворота
            resetRotation();

            document.getElementById('sidebar').classList.add('active');
            document.getElementById('overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.body.style.overflow = '';
            resetRotation();
        }

        // ─── 3D-поворот карточки ───
        const card3d = document.getElementById('card-3d');
        let rotX = 0, rotY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;
        let startRotX = 0, startRotY = 0;

        function applyRotation() {
            card3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }

        function resetRotation() {
            rotX = 0; rotY = 0;
            card3d.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.3, 0.64, 1)';
            applyRotation();
            setTimeout(() => { card3d.style.transition = 'transform 0.1s ease-out'; }, 500);
        }

        function onStart(x, y) {
            isDragging = true;
            startX = x; startY = y;
            startRotX = rotX; startRotY = rotY;
            card3d.classList.add('touched');
            card3d.style.transition = 'none';
        }

        function onMove(x, y) {
            if (!isDragging) return;
            const dx = x - startX;
            const dy = y - startY;
            rotY = Math.max(-30, Math.min(30, startRotY + dx * 0.3));
            rotX = Math.max(-30, Math.min(30, startRotX - dy * 0.3));
            applyRotation();
        }

        function onEnd() {
            isDragging = false;
            card3d.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.3, 0.64, 1)';
            rotX = 0; rotY = 0;
            applyRotation();
        }

        // Мышь
        card3d.addEventListener('mousedown', (e) => {
            if (e.target.closest('button, a')) return;
            onStart(e.clientX, e.clientY);
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
        document.addEventListener('mouseup', onEnd);

        // Тач
        card3d.addEventListener('touchstart', (e) => {
            if (e.target.closest('button, a')) return;
            const t = e.touches[0];
            onStart(t.clientX, t.clientY);
        }, { passive: true });
        card3d.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            onMove(t.clientX, t.clientY);
        }, { passive: true });
        card3d.addEventListener('touchend', onEnd);

        // Закрытие
        document.getElementById('sidebar-close').addEventListener('click', closeSidebar);
        document.getElementById('overlay').addEventListener('click', closeSidebar);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
        });

        // Поиск
        document.getElementById('search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        // Фильтры
        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        load();
    </script>
</body>
</html>
