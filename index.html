<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уфа для своих — афиша</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #262626;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --accent: #c4ff4d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
        h1 span { color: var(--accent); }
        #count { color: var(--muted); font-size: 0.9rem; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .filters button {
            background: transparent; color: var(--muted);
            border: 1px solid var(--border); padding: 8px 16px;
            border-radius: 100px; cursor: pointer; font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filters button:hover { border-color: var(--accent); color: var(--text); }
        .filters button.active {
            background: var(--accent); color: #000;
            border-color: var(--accent); font-weight: 600;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .card-image {
            width: 100%; aspect-ratio: 4/3;
            background: linear-gradient(135deg, #1f1f1f, #2a2a2a);
            background-size: cover; background-position: center;
            position: relative;
        }
        .card-image::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.5));
        }
        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-tag {
            display: inline-block; font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent);
            margin-bottom: 8px; font-weight: 600;
        }
        .card h3 {
            font-size: 1.05rem; margin-bottom: 10px;
            line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-meta {
            font-size: 0.85rem; color: var(--muted);
            margin-bottom: 4px;
        }
        .card-price {
            margin-top: auto; padding-top: 12px;
            font-weight: 700; font-size: 0.95rem;
        }
        .card-price.free { color: var(--accent); }
        .card-link {
            display: inline-block; margin-top: 10px;
            font-size: 0.85rem; color: var(--accent);
            text-decoration: none; font-weight: 600;
        }
        .card-link:hover { text-decoration: underline; }
        .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Уфа <span>для своих</span></h1>
        <div id="count"></div>
    </header>

    <div class="filters">
        <button data-filter="all" class="active">Все</button>
        <button data-filter="free">Бесплатно</button>
        <button data-filter="party">Тусовки</button>
        <button data-filter="music">Музыка</button>
        <button data-filter="art">Арт</button>
    </div>

    <div id="feed" class="grid"></div>

    <script>
        let allEvents = [];
        let currentFilter = 'all';

        async function load() {
            try {
                const res = await fetch('events.json?t=' + Date.now());
                allEvents = await res.json();
                render();
            } catch (err) {
                document.getElementById('feed').innerHTML =
                    '<div class="empty">Ошибка загрузки данных.</div>';
                console.error(err);
            }
        }

        function formatDate(e) {
            // Склеиваем дату и время из полей нового формата
            const parts = [];
            if (e.date_text) parts.push(e.date_text);
            if (e.time_text) parts.push(e.time_text);
            if (parts.length) return parts.join(' · ');
            if (e.start) {
                try {
                    const d = new Date(e.start);
                    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
                } catch (_) {}
            }
            return 'Дата уточняется';
        }

        function render() {
            const feed = document.getElementById('feed');
            const countEl = document.getElementById('count');

            let filtered = allEvents;
            if (currentFilter === 'free') {
                filtered = allEvents.filter(e => (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод'));
            } else if (currentFilter === 'party') {
                filtered = allEvents.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('вечерин') || t.includes('party') || t.includes('тусов') || t.includes('рейв');
                });
            } else if (currentFilter === 'music') {
                filtered = allEvents.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('концерт') || t.includes('музык') || t.includes('джаз') || t.includes('dj');
                });
            } else if (currentFilter === 'art') {
                filtered = allEvents.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('выстав') || t.includes('арт') || t.includes('галере') || t.includes('музей');
                });
            }

            countEl.textContent = filtered.length + ' событий';

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="empty">Ничего не найдено. Попробуй другой фильтр.</div>';
                return;
            }

            feed.innerHTML = filtered.map(e => {
                const img = e.image
                    ? `style="background-image: url('${e.image}')"`
                    : '';
                const priceClass = (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод') ? 'free' : '';
                const link = e.source_link ? `<a class="card-link" href="${e.source_link}" target="_blank" rel="noopener">Открыть пост →</a>` : '';
                const source = e.source ? `<div class="card-tag">@${e.source}</div>` : '';

                return `
                    <div class="card">
                        <div class="card-image" ${img}></div>
                        <div class="card-body">
                            ${source}
                            <h3>${e.title || 'Без названия'}</h3>
                            <div class="card-meta">📅 ${formatDate(e)}</div>
                            <div class="card-meta">📍 ${e.venue || 'Место уточняется'}</div>
                            <div class="card-price ${priceClass}">${e.price || 'Цена уточняется'}</div>
                            ${link}
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        load();
    </script>
</body>
</html>
