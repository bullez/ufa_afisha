<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Уфа для своих — афиша</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #262626;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --accent: #c4ff4d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            padding-bottom: 80px;
            max-width: 1200px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
        h1 span { color: var(--accent); }

        /* ─── Погода Уфы ─── */
        #weather {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 18px;
            font-size: 0.95rem;
            min-width: 180px;
        }
        #weather .weather-icon { font-size: 1.8rem; line-height: 1; }
        #weather .weather-info { display: flex; flex-direction: column; }
        #weather .weather-temp { font-size: 1.2rem; font-weight: 800; color: var(--accent); }
        #weather .weather-desc { font-size: 0.8rem; color: var(--muted); }

        #count { color: var(--muted); font-size: 0.9rem; font-weight: 500; }

        /* ─── AI-Поиск ─── */
        .ai-search {
            background: linear-gradient(135deg, rgba(196, 255, 77, 0.08) 0%, rgba(196, 255, 77, 0.02) 100%);
            border: 1px solid rgba(196, 255, 77, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .ai-search-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .ai-search-header .icon { font-size: 1.4rem; }
        .ai-search-header h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
        }
        .ai-search-header .status {
            font-size: 0.75rem;
            color: var(--muted);
            margin-left: auto;
        }
        .ai-search input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .ai-search input:focus { border-color: var(--accent); }
        .ai-search input::placeholder { color: #555; }
        .ai-search input:disabled { opacity: 0.5; cursor: not-allowed; }

        .search-wrap { margin-bottom: 20px; position: relative; }
        .search-wrap input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px 14px 44px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
        }

        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .filters button {
            background: var(--card); color: var(--muted);
            border: 1px solid var(--border); padding: 10px 20px;
            border-radius: 100px; cursor: pointer; font-size: 0.9rem;
            transition: all 0.2s; font-weight: 500;
        }
        .filters button:hover { border-color: var(--accent); color: var(--text); }
        .filters button.active {
            background: var(--accent); color: #000;
            border-color: var(--accent); font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; overflow: hidden;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            display: flex; flex-direction: column;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(196, 255, 77, 0.08);
        }
        .card-image {
            width: 100%; aspect-ratio: 4/3;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            background-size: cover; background-position: center;
            position: relative;
        }
        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-tag {
            display: inline-block; font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent);
            margin-bottom: 8px; font-weight: 700;
        }
        .card h3 {
            font-size: 1.05rem; margin-bottom: 10px;
            line-height: 1.35; font-weight: 700;
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-meta {
            font-size: 0.85rem; color: var(--muted);
            margin-bottom: 5px; display: flex; align-items: center; gap: 6px;
        }
        .card-price {
            margin-top: auto; padding-top: 12px;
            font-weight: 800; font-size: 1rem;
        }
        .card-price.free { color: var(--accent); }
        .card-score {
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: 6px;
            font-weight: 600;
        }

        /* ─── Сайдбар на весь экран ─── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 998;
            backdrop-filter: blur(8px);
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
            pointer-events: none;
            background: #0f0f0f;
        }
        .sidebar.active {
            transform: translateX(0);
            pointer-events: auto;
        }

        .sidebar-inner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
        }

        .card-3d-wrap {
            flex: 0 0 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 50% 50%, #151515 0%, #0a0a0a 100%);
            perspective: 1500px;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        .card-3d {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            background: #1a1a1a;
            background-size: cover;
            background-position: center;
            box-shadow:
                0 30px 60px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.08) inset;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: grab;
            position: relative;
        }
        .card-3d:active { cursor: grabbing; }
        .card-3d::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .card-3d-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: var(--muted);
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 100px;
            border: 1px solid var(--border);
            pointer-events: none;
            transition: opacity 0.4s;
            opacity: 0;
            white-space: nowrap;
        }
        .sidebar.active .card-3d-hint { opacity: 1; }
        .card-3d-wrap.touched .card-3d-hint { opacity: 0; }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid var(--border);
            background: #0f0f0f;
            height: 100vh;
        }
        .card-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .card-info-header h2 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .card-info-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text);
            font-size: 1.4rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            line-height: 1;
            flex-shrink: 0;
        }
        .card-info-close:hover { background: rgba(255,255,255,0.18); }

        .card-info-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 32px 28px;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .card-info-scroll::-webkit-scrollbar { width: 8px; }
        .card-info-scroll::-webkit-scrollbar-track { background: transparent; }
        .card-info-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .card-info-tag {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 700;
            padding: 4px 10px;
            background: rgba(196, 255, 77, 0.1);
            border-radius: 6px;
        }
        .card-info-title {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        .card-info-meta {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        .card-info-meta-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 1rem;
        }
        .card-info-meta-item .icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }
        .card-info-meta-item .label {
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .card-info-meta-item .value { color: var(--text); font-weight: 500; }
        .card-info-meta-item .value.price-free { color: var(--accent); font-weight: 700; }

        .card-info-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #d0d0d0;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 24px;
            padding: 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .card-info-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card-info-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .card-info-btn.primary {
            background: var(--accent);
            color: #000;
        }
        .card-info-btn.primary:hover { opacity: 0.85; transform: translateY(-2px); }
        .card-info-btn.secondary {
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .card-info-btn.secondary:hover { background: rgba(255,255,255,0.1); }

        .empty { text-align: center; padding: 80px 20px; color: var(--muted); grid-column: 1/-1; }

        @media (max-width: 800px) {
            .sidebar-inner { flex-direction: column; }
            .card-3d-wrap { flex: 0 0 45%; height: 45vh; padding: 10px; }
            .card-3d { border-radius: 12px; }
            .card-info { height: 55vh; border-left: none; border-top: 1px solid var(--border); }
            .card-info-title { font-size: 1.3rem; }
            .card-info-scroll { padding: 20px; }
            h1 { font-size: 1.5rem; }
            #weather { padding: 8px 14px; font-size: 0.85rem; min-width: auto; }
            #weather .weather-icon { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
            .filters button { padding: 8px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Уфа <span>для своих</span></h1>
        <div id="weather">
            <span class="weather-icon" id="weather-icon">🌤️</span>
            <div class="weather-info">
                <span class="weather-temp" id="weather-temp">—</span>
                <span class="weather-desc" id="weather-desc">Загрузка...</span>
            </div>
        </div>
    </header>

    <!-- AI-Поиск -->
    <div class="ai-search">
        <div class="ai-search-header">
            <span class="icon">🤖</span>
            <h2>Спроси меня о событиях</h2>
            <span class="status" id="ai-status">Загрузка модели...</span>
        </div>
        <input type="text" id="ai-query" placeholder="Например: хочу что-то атмосферное и недорогое..." disabled>
    </div>

    <div class="search-wrap">
        <input type="text" id="search" placeholder="Поиск по словам...">
    </div>

    <div class="filters">
        <button data-filter="all" class="active">Все</button>
        <button data-filter="free">Бесплатно</button>
        <button data-filter="party">Тусовки</button>
        <button data-filter="music">Музыка</button>
        <button data-filter="art">Арт</button>
        <button data-filter="today">Сегодня</button>
    </div>

    <div id="feed" class="grid"></div>

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <div class="card-3d-wrap" id="card-3d-wrap">
                <div class="card-3d" id="card-3d"></div>
                <div class="card-3d-hint">👆 Поверни карточку</div>
            </div>
            <div class="card-info">
                <div class="card-info-header">
                    <h2>Событие</h2>
                    <button class="card-info-close" id="sidebar-close">×</button>
                </div>
                <div class="card-info-scroll" id="card-info-content"></div>
            </div>
        </div>
    </aside>

    <!-- Transformers.js для AI-поиска -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

        env.allowLocalModels = false;

        let extractor = null;
        let eventEmbeddings = [];
        let allEvents = [];
        let aiReady = false;

        // ─── Погода Уфы (Open-Meteo + wttr.in резерв) ───
        async function loadWeather() {
            const tempEl = document.getElementById('weather-temp');
            const descEl = document.getElementById('weather-desc');
            const iconEl = document.getElementById('weather-icon');

            // Пробуем Open-Meteo
            try {
                const res = await fetch(
                    'https://api.open-meteo.com/v1/forecast?latitude=54.7388&longitude=55.9721&current=temperature_2m,weather_code&timezone=Asia%2FYekaterinburg',
                    { signal: AbortSignal.timeout(5000) }
                );
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;

                const weatherMap = {
                    0: ['☀️', 'Ясно'], 1: ['🌤️', 'Преимущественно ясно'],
                    2: ['⛅', 'Переменная облачность'], 3: ['☁️', 'Пасмурно'],
                    45: ['🌫️', 'Туман'], 48: ['🌫️', 'Туман'],
                    51: ['🌦️', 'Лёгкая морось'], 53: ['🌦️', 'Морось'], 55: ['🌦️', 'Сильная морось'],
                    61: ['🌧️', 'Небольшой дождь'], 63: ['🌧️', 'Дождь'], 65: ['🌧️', 'Сильный дождь'],
                    71: ['🌨️', 'Небольшой снег'], 73: ['🌨️', 'Снег'], 75: ['🌨️', 'Сильный снег'],
                    80: ['🌧️', 'Ливень'], 81: ['🌧️', 'Сильный ливень'], 82: ['🌧️', 'Очень сильный ливень'],
                    95: ['⛈️', 'Гроза'], 96: ['⛈️', 'Гроза с градом'], 99: ['⛈️', 'Сильная гроза с градом'],
                };
                const [icon, desc] = weatherMap[code] || ['🌡️', 'Погода'];

                iconEl.textContent = icon;
                tempEl.textContent = temp + '°C';
                descEl.textContent = desc;
                return;
            } catch (err) {
                console.warn('Open-Meteo failed, trying wttr.in...', err);
            }

            // Резерв: wttr.in
            try {
                const res = await fetch(
                    'https://wttr.in/Ufa?format=j1',
                    { signal: AbortSignal.timeout(5000) }
                );
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const current = data.current_condition[0];
                const temp = current.temp_C;
                const desc = current.lang_ru ? current.lang_ru[0].value : current.weatherDesc[0].value;

                const code = parseInt(current.weatherCode);
                const iconMap = {
                    113: '☀️', 116: '🌤️', 119: '☁️', 122: '☁️',
                    143: '🌫️', 176: '🌦️', 179: '🌨️', 182: '🌨️', 185: '🌨️',
                    200: '⛈️', 227: '🌨️', 230: '🌨️', 248: '🌫️', 260: '🌫️',
                    263: '🌦️', 266: '🌦️', 281: '🌧️', 284: '🌧️',
                    293: '🌧️', 296: '🌧️', 299: '🌧️', 302: '🌧️', 305: '🌧️', 308: '🌧️',
                    311: '🌧️', 314: '🌧️', 317: '🌨️', 320: '🌨️', 323: '🌨️', 326: '🌨️',
                    329: '🌨️', 332: '🌨️', 335: '🌨️', 338: '🌨️',
                    350: '🌧️', 353: '🌦️', 356: '🌧️', 359: '🌧️',
                    362: '🌨️', 365: '🌨️', 368: '🌨️', 371: '🌨️',
                    374: '🌨️', 377: '🌨️', 386: '⛈️', 389: '⛈️',
                    392: '⛈️', 395: '🌨️',
                };
                const icon = iconMap[code] || '🌡️';

                iconEl.textContent = icon;
                tempEl.textContent = temp + '°C';
                descEl.textContent = desc;
            } catch (err) {
                console.error('Both weather APIs failed:', err);
                tempEl.textContent = '—';
                descEl.textContent = 'Погода недоступна';
            }
        }
        loadWeather();
        setInterval(loadWeather, 30 * 60 * 1000);

        // ─── AI-модель ───
        async function initAI() {
            const statusEl = document.getElementById('ai-status');
            const inputEl = document.getElementById('ai-query');

            try {
                statusEl.textContent = 'Загрузка модели (33 МБ)...';

                extractor = await pipeline(
                    'feature-extraction',
                    'Xenova/all-MiniLM-L6-v2',
                    { dtype: 'q8' }
                );

                statusEl.textContent = 'Готово! Спрашивай.';
                inputEl.disabled = false;
                aiReady = true;

                await indexEvents();
            } catch (err) {
                console.error('AI init error:', err);
                statusEl.textContent = 'AI недоступен';
            }
        }

        async function indexEvents() {
            if (!extractor || allEvents.length === 0) return;

            const statusEl = document.getElementById('ai-status');
            statusEl.textContent = 'Индексация событий...';

            eventEmbeddings = [];

            for (const event of allEvents) {
                const text = `${event.title || ''} ${event.desc || ''} ${event.venue || ''}`.trim();
                if (!text) {
                    eventEmbeddings.push(null);
                    continue;
                }

                try {
                    const output = await extractor(text, { pooling: 'mean', normalize: true });
                    eventEmbeddings.push(Array.from(output.data));
                } catch (err) {
                    console.error('Embedding error:', err);
                    eventEmbeddings.push(null);
                }
            }

            statusEl.textContent = `Готово! Проиндексировано ${eventEmbeddings.filter(e => e).length} событий.`;
        }

        function cosineSimilarity(a, b) {
            if (!a || !b) return 0;
            let dot = 0, normA = 0, normB = 0;
            for (let i = 0; i < a.length; i++) {
                dot += a[i] * b[i];
                normA += a[i] * a[i];
                normB += b[i] * b[i];
            }
            return dot / (Math.sqrt(normA) * Math.sqrt(normB));
        }

        async function aiSearch(query) {
            if (!extractor || !query.trim()) {
                renderAll();
                return;
            }

            const statusEl = document.getElementById('ai-status');
            statusEl.textContent = 'Ищу...';

            try {
                const output = await extractor(query, { pooling: 'mean', normalize: true });
                const queryEmbedding = Array.from(output.data);

                const scored = allEvents.map((event, idx) => ({
                    event,
                    score: eventEmbeddings[idx] ? cosineSimilarity(queryEmbedding, eventEmbeddings[idx]) : 0
                }));

                scored.sort((a, b) => b.score - a.score);

                const relevant = scored.filter(s => s.score > 0.2);

                statusEl.textContent = `Найдено ${relevant.length} событий`;
                renderWithScores(relevant);
            } catch (err) {
                console.error('AI search error:', err);
                statusEl.textContent = 'Ошибка поиска';
            }
        }

        // ─── Логика сайта ───
        let currentFilter = 'all';
        let searchQuery = '';

        async function load() {
            try {
                const res = await fetch('events.json?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                allEvents = await res.json();
                render();

                if (aiReady) await indexEvents();
            } catch (err) {
                document.getElementById('feed').innerHTML =
                    '<div class="empty">Ошибка загрузки данных. Проверь events.json.</div>';
                console.error(err);
            }
        }

        function formatDate(e) {
            const parts = [];
            if (e.date_text) parts.push(e.date_text);
            if (e.time_text) parts.push(e.time_text);
            if (parts.length) return parts.join(' · ');
            return 'Дата уточняется';
        }

        function isToday(e) {
            if (!e.date_text) return false;
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return e.date_text === `${dd}.${mm}.${yyyy}`;
        }

        function sortEvents(events) {
            return [...events].sort((a, b) => {
                const aHasDate = !!a.date_text;
                const bHasDate = !!b.date_text;
                if (aHasDate && bHasDate) return a.date_text.localeCompare(b.date_text);
                if (aHasDate) return -1;
                if (bHasDate) return 1;
                return 0;
            });
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s || '';
            return div.innerHTML;
        }

        function renderCard(e, idx, score) {
            const img = e.image ? `style="background-image: url('${e.image}')"` : '';
            const priceClass = (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод') ? 'free' : '';
            const source = e.source ? `<div class="card-tag">@${e.source}</div>` : '';
            const scoreHtml = score !== undefined ? `<div class="card-score">Релевантность: ${Math.round(score * 100)}%</div>` : '';

            return `
                <div class="card" data-index="${idx}" onclick="openSidebar(${idx})">
                    <div class="card-image" ${img}></div>
                    <div class="card-body">
                        ${source}
                        <h3>${escapeHtml(e.title) || 'Без названия'}</h3>
                        <div class="card-meta">📅 ${formatDate(e)}</div>
                        <div class="card-meta">📍 ${escapeHtml(e.venue) || 'Место уточняется'}</div>
                        <div class="card-price ${priceClass}">${escapeHtml(e.price) || 'Цена уточняется'}</div>
                        ${scoreHtml}
                    </div>
                </div>
            `;
        }

        function render() {
            const feed = document.getElementById('feed');
            const countEl = document.getElementById('count');

            let filtered = allEvents;

            if (currentFilter === 'free') {
                filtered = filtered.filter(e => (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод'));
            } else if (currentFilter === 'party') {
                filtered = filtered.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('вечерин') || t.includes('party') || t.includes('тусов') || t.includes('рейв');
                });
            } else if (currentFilter === 'music') {
                filtered = filtered.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('концерт') || t.includes('музык') || t.includes('джаз') || t.includes('dj');
                });
            } else if (currentFilter === 'art') {
                filtered = filtered.filter(e => {
                    const t = ((e.title || '') + ' ' + (e.desc || '')).toLowerCase();
                    return t.includes('выстав') || t.includes('арт') || t.includes('галере') || t.includes('музей');
                });
            } else if (currentFilter === 'today') {
                filtered = filtered.filter(isToday);
            }

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(e => {
                    const text = ((e.title || '') + ' ' + (e.desc || '') + ' ' + (e.venue || '')).toLowerCase();
                    return text.includes(q);
                });
            }

            filtered = sortEvents(filtered);
            countEl.textContent = filtered.length + ' событий';

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="empty">Ничего не найдено. Попробуй другой фильтр.</div>';
                return;
            }

            feed.innerHTML = filtered.map((e, idx) => renderCard(e, idx)).join('');
            window.currentFiltered = filtered;
        }

        function renderWithScores(scored) {
            const feed = document.getElementById('feed');
            const countEl = document.getElementById('count');

            countEl.textContent = scored.length + ' событий';

            if (scored.length === 0) {
                feed.innerHTML = '<div class="empty">Ничего не найдено по смыслу. Попробуй другой запрос.</div>';
                return;
            }

            feed.innerHTML = scored.map((s, idx) => renderCard(s.event, idx, s.score)).join('');
            window.currentFiltered = scored.map(s => s.event);
        }

        function renderAll() {
            render();
        }

        function openSidebar(index) {
            const e = window.currentFiltered[index];
            if (!e) return;

            const content = document.getElementById('card-info-content');
            const card3d = document.getElementById('card-3d');
            const isFree = (e.price || '').toLowerCase().includes('бесплат') || (e.price || '').toLowerCase().includes('свобод');

            if (e.image) {
                card3d.style.backgroundImage = `url('${e.image}')`;
            } else {
                card3d.style.backgroundImage = 'linear-gradient(135deg, #1a1a1a, #2a2a2a)';
            }

            const tagHtml = e.source ? `<div class="card-info-tag">@${escapeHtml(e.source)}</div>` : '';
            const fullText = e.raw || e.desc || 'Описание отсутствует.';

            content.innerHTML = `
                ${tagHtml}
                <h1 class="card-info-title">${escapeHtml(e.title) || 'Без названия'}</h1>
                <div class="card-info-meta">
                    <div class="card-info-meta-item">
                        <span class="icon">📅</span>
                        <div><div class="label">Дата и время</div><div class="value">${formatDate(e)}</div></div>
                    </div>
                    <div class="card-info-meta-item">
                        <span class="icon">📍</span>
                        <div><div class="label">Место</div><div class="value">${escapeHtml(e.venue) || 'Уточняется'}</div></div>
                    </div>
                    <div class="card-info-meta-item">
                        <span class="icon">💰</span>
                        <div><div class="label">Цена</div><div class="value ${isFree ? 'price-free' : ''}">${escapeHtml(e.price) || 'Уточняется'}</div></div>
                    </div>
                </div>
                <div class="card-info-text">${escapeHtml(fullText)}</div>
                <div class="card-info-actions">
                    ${e.source_link ? `<a class="card-info-btn primary" href="${e.source_link}" target="_blank" rel="noopener">📱 Открыть в Telegram</a>` : ''}
                    <button class="card-info-btn secondary" onclick="closeSidebar()">Закрыть</button>
                </div>
            `;

            resetRotation();
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.body.style.overflow = '';
            resetRotation();
        }

        const card3d = document.getElementById('card-3d');
        const card3dWrap = document.getElementById('card-3d-wrap');
        let rotX = 0, rotY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;
        let startRotX = 0, startRotY = 0;

        function applyRotation() {
            card3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }

        function resetRotation() {
            rotX = 0; rotY = 0;
            card3d.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.3, 0.64, 1)';
            applyRotation();
            setTimeout(() => { card3d.style.transition = 'transform 0.1s ease-out'; }, 600);
        }

        function onStart(x, y) {
            isDragging = true;
            startX = x; startY = y;
            startRotX = rotX; startRotY = rotY;
            card3dWrap.classList.add('touched');
            card3d.style.transition = 'none';
        }

        function onMove(x, y) {
            if (!isDragging) return;
            const dx = x - startX;
            const dy = y - startY;
            rotY = Math.max(-40, Math.min(40, startRotY + dx * 0.4));
            rotX = Math.max(-40, Math.min(40, startRotX - dy * 0.4));
            applyRotation();
        }

        function onEnd() {
            isDragging = false;
            card3d.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.3, 0.64, 1)';
            rotX = 0; rotY = 0;
            applyRotation();
        }

        card3d.addEventListener('mousedown', (e) => { onStart(e.clientX, e.clientY); e.preventDefault(); });
        document.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
        document.addEventListener('mouseup', onEnd);
        card3d.addEventListener('touchstart', (e) => { const t = e.touches[0]; onStart(t.clientX, t.clientY); }, { passive: true });
        card3d.addEventListener('touchmove', (e) => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
        card3d.addEventListener('touchend', onEnd);

        document.getElementById('sidebar-close').addEventListener('click', closeSidebar);
        document.getElementById('overlay').addEventListener('click', closeSidebar);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebar(); });

        document.getElementById('search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        document.getElementById('ai-query').addEventListener('input', (e) => {
            const query = e.target.value;
            if (query.length > 3) {
                aiSearch(query);
            } else if (query.length === 0) {
                renderAll();
            }
        });

        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        load();
        initAI();
    </script>
</body>
</html>
