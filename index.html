<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уфа для своих — афиша для миллениалов</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #262626;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --accent: #c4ff4d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
        h1 span { color: var(--accent); }
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .filters button {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 100px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filters button:hover { border-color: var(--accent); color: var(--text); }
        .filters button.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }
        .card-image {
            width: 100%;
            height: 160px;
            background: #1f1f1f;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .card-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.6));
        }
        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-tag {
            display: inline-block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .card-meta {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .card-price {
            margin-top: auto;
            padding-top: 12px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .card-price.free { color: var(--accent); }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Уфа <span>для своих</span></h1>
        <div id="count" style="color: var(--muted); font-size: 0.9rem;"></div>
    </header>

    <div class="filters">
        <button data-filter="all" class="active">Все</button>
        <button data-filter="free">Бесплатно</button>
        <button data-filter="party">Тусовки</button>
        <button data-filter="music">Музыка</button>
        <button data-filter="art">Арт</button>
    </div>

    <div id="feed" class="grid"></div>

    <script>
        let allEvents = [];
        let currentFilter = 'all';

        async function load() {
            try {
                const res = await fetch('events.json?t=' + Date.now());
                allEvents = await res.json();
                render();
            } catch (err) {
                document.getElementById('feed').innerHTML = 
                    '<div class="empty">Ошибка загрузки. Запусти fetch_events.py.</div>';
                console.error(err);
            }
        }

        function render() {
            const feed = document.getElementById('feed');
            const countEl = document.getElementById('count');
            
            let filtered = allEvents;
            if (currentFilter === 'free') {
                filtered = allEvents.filter(e => (e.price || '').toLowerCase().includes('бесплат'));
            } else if (currentFilter === 'party') {
                filtered = allEvents.filter(e => (e.category || '').toLowerCase().includes('вечерин') || (e.title || '').toLowerCase().includes('party'));
            } else if (currentFilter === 'music') {
                filtered = allEvents.filter(e => (e.category || '').toLowerCase().includes('музык') || (e.title || '').toLowerCase().includes('концерт'));
            } else if (currentFilter === 'art') {
                filtered = allEvents.filter(e => (e.category || '').toLowerCase().includes('арт') || (e.category || '').toLowerCase().includes('выстав'));
            }

            countEl.textContent = filtered.length + ' событий';

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="empty">Ничего не найдено. Попробуй другой фильтр.</div>';
                return;
            }

            feed.innerHTML = filtered.map(e => {
                const img = e.image 
                    ? `style="background-image: url('${e.image}')"` 
                    : `style="background: linear-gradient(135deg, #1f1f1f, #2a2a2a)"`;
                
                const priceClass = (e.price || '').toLowerCase().includes('бесплат') ? 'free' : '';
                
                return `
                    <div class="card">
                        <div class="card-image" ${img}></div>
                        <div class="card-body">
                            ${e.category ? `<div class="card-tag">${e.category}</div>` : ''}
                            <h3>${e.title || 'Без названия'}</h3>
                            <div class="card-meta">📅 ${e.date || 'Дата не указана'}</div>
                            <div class="card-meta">📍 ${e.place || e.venue || 'Место не указано'}</div>
                            <div class="card-price ${priceClass}">${e.price || 'Цена не указана'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        load();
    </script>
</body>
</html>
