      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A  # <- ЭТА СТРОЧКА ВАЖНА: она говорит "добавь всё, включая удаления"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update events and cleanup" && git push)
