name: Update Events
on:
  schedule:
    - cron: '0 6 * * *' # Каждый день в 6 утра
  workflow_dispatch: # Или по кнопке
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Fetch events
        run: python fetch_events.py
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add events.json
          git commit -m "Auto-update events" || exit 0
          git push
