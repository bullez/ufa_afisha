name: Update events

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz

      - name: Run fetch script
        run: python fetch_events.py

      - name: Validate data
        run: |
          python -c "
          import json, sys
          n = len(json.load(open('events.json')))
          print(f'events: {n}')
          sys.exit(1 if n < 5 else 0)
          "

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update events"

      - name: Push with rebase and auto-resolve conflicts
        run: |
          # Пробуем забрать свежие изменения
          git pull --rebase origin main || {
            echo "Конфликт при rebase. Разрешаем в пользу наших данных (events.json)."
            # Наши events.json всегда свежие, поэтому берём их версию
            git checkout --theirs events.json data/events.json 2>/dev/null || git checkout --ours events.json data/events.json 2>/dev/null || true
            git add -A
            GIT_EDITOR=true git rebase --continue || git rebase --skip || git rebase --abort
          }
          git push origin main
